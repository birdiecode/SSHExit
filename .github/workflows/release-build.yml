name: Android Release Build
run-name: Android Release v${{ inputs.version }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Calculated version (normally supplied by Android Release)"
        required: true
        type: string
      release_type:
        description: "Release type"
        required: true
        type: choice
        options:
          - "Patch - bug fixes"
          - "Minor - new features"
          - "Major - breaking changes"
      source_sha:
        description: "Main commit used to calculate the version"
        required: true
        type: string

permissions:
  actions: write
  contents: write

concurrency:
  group: android-release-main
  cancel-in-progress: false

jobs:
  release:
    name: Android Release v${{ inputs.version }}
    runs-on: ubuntu-latest
    env:
      APP_VERSION: ${{ inputs.version }}
      RELEASE_TYPE: ${{ inputs.release_type }}
      SOURCE_SHA: ${{ inputs.source_sha }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Validate source, version and tag
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA" || { echo "main changed since version calculation. Run Android Release again."; exit 1; }
          python3 scripts/release_version.py --kind "$RELEASE_TYPE" --expected "$APP_VERSION"
          python3 - <<'PY'
          import os
          import re
          import sys

          version = os.environ["APP_VERSION"]
          if not re.fullmatch(r"\d+\.\d+\.\d+", version):
              print("Version must use X.Y.Z format, for example 1.2.3", file=sys.stderr)
              sys.exit(1)
          PY
          if git ls-remote --exit-code --tags origin "refs/tags/v${APP_VERSION}" >/dev/null 2>&1; then
            echo "Tag v${APP_VERSION} already exists."
            exit 1
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-36 build-tools;36.0.0

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Restore signing keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "Set the ANDROID_KEYSTORE_BASE64 repository secret before running a release."
            exit 1
          fi
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/ssh2socks-release.p12"
          chmod 600 "$RUNNER_TEMP/ssh2socks-release.p12"
          test -s "$RUNNER_TEMP/ssh2socks-release.p12"

      - name: Set application version
        run: python3 scripts/release_version.py --kind "$RELEASE_TYPE" --expected "$APP_VERSION" --write

      - name: Build signed release APK
        env:
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/ssh2socks-release.p12
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$ANDROID_KEYSTORE_PASSWORD" || { echo "Missing ANDROID_KEYSTORE_PASSWORD secret."; exit 1; }
          test -n "$ANDROID_KEY_ALIAS" || { echo "Missing ANDROID_KEY_ALIAS secret."; exit 1; }
          test -n "$ANDROID_KEY_PASSWORD" || { echo "Missing ANDROID_KEY_PASSWORD secret."; exit 1; }
          gradle --no-daemon assembleRelease

      - name: Verify and prepare signed APK
        run: |
          APK="app/build/outputs/apk/release/app-release.apk"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$APK"
          cp "$APK" "sshexit-${APP_VERSION}.apk"

      - name: Commit version and push tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/build.gradle
          git commit -m "chore(release): set version ${APP_VERSION}"
          git tag -a "v${APP_VERSION}" -m "SSHExit v${APP_VERSION}"
          git push --atomic origin HEAD:main "refs/tags/v${APP_VERSION}"

      - name: Trigger standard CI for the version commit
        run: gh workflow run android.yml --ref main

      - name: Create GitHub Release
        run: |
          gh release create "v${APP_VERSION}" "sshexit-${APP_VERSION}.apk" \
            --title "SSHExit v${APP_VERSION}" \
            --notes "Signed Android APK for SSHExit v${APP_VERSION}."
