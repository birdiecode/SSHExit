name: Android Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Версия релиза в формате X.Y.Z, например 1.2.3"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: android-release-main
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish Android release
    runs-on: ubuntu-latest
    env:
      APP_VERSION: ${{ inputs.version }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Validate version and tag
        run: |
          python3 - <<'PY'
          import os
          import re
          import sys

          version = os.environ["APP_VERSION"]
          if not re.fullmatch(r"\\d+\\.\\d+\\.\\d+", version):
              print("Version must use X.Y.Z format, for example 1.2.3", file=sys.stderr)
              sys.exit(1)
          PY
          if git ls-remote --exit-code --tags origin "refs/tags/v${APP_VERSION}" >/dev/null 2>&1; then
            echo "Tag v${APP_VERSION} already exists."
            exit 1
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-36 build-tools;36.0.0

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Set application version
        run: |
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          path = Path("app/build.gradle")
          source = path.read_text()
          code_pattern = re.compile(r"(?m)^(\\s*versionCode\\s+)(\\d+)(\\s*)$")
          name_pattern = re.compile(r'(?m)^(\\s*versionName\\s+")[^"]*("\\s*)$')

          code_matches = list(code_pattern.finditer(source))
          name_matches = list(name_pattern.finditer(source))
          if len(code_matches) != 1 or len(name_matches) != 1:
              raise SystemExit("Could not find exactly one versionCode and versionName in app/build.gradle")

          current_code = int(code_matches[0].group(2))
          source = code_pattern.sub(
              lambda match: f"{match.group(1)}{current_code + 1}{match.group(3)}",
              source,
              count=1,
          )
          source = name_pattern.sub(
              lambda match: f'{match.group(1)}{os.environ["APP_VERSION"]}{match.group(2)}',
              source,
              count=1,
          )
          path.write_text(source)
          PY

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Prepare release APK
        run: cp app/build/outputs/apk/debug/app-debug.apk "ssh2socks-${APP_VERSION}-debug.apk"

      - name: Commit version and push tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/build.gradle
          git commit -m "chore(release): set version ${APP_VERSION}"
          git tag -a "v${APP_VERSION}" -m "SSH2SOCKS v${APP_VERSION}"
          git push --atomic origin HEAD:main "refs/tags/v${APP_VERSION}"

      - name: Create GitHub Release
        run: |
          gh release create "v${APP_VERSION}" "ssh2socks-${APP_VERSION}-debug.apk" \
            --title "SSH2SOCKS v${APP_VERSION}" \
            --notes "Debug APK for SSH2SOCKS v${APP_VERSION}."
