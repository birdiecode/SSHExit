name: Android Release
run-name: Android Release - ${{ inputs.release_type }}

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: "Release type"
        required: true
        default: "Patch - bug fixes"
        type: choice
        options:
          - "Patch - bug fixes"
          - "Minor - new features"
          - "Major - breaking changes"

permissions:
  actions: write
  contents: read

concurrency:
  group: android-release-dispatch
  cancel-in-progress: false

jobs:
  prepare:
    name: Calculate release version
    runs-on: ubuntu-latest
    env:
      RELEASE_TYPE: ${{ inputs.release_type }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Test version calculation
        run: python3 -m unittest discover -s scripts -p test_release_version.py

      - name: Calculate next version and start build
        run: |
          VERSION="$(python3 scripts/release_version.py --kind "$RELEASE_TYPE")"
          SOURCE_SHA="$(git rev-parse HEAD)"
          gh workflow run release-build.yml --ref main \
            -f version="$VERSION" -f release_type="$RELEASE_TYPE" -f source_sha="$SOURCE_SHA"
          {
            echo "### Android Release v$VERSION"
            echo "Release type: $RELEASE_TYPE"
            echo "A separate version-named build has been started:"
            echo "[Open release builds](https://github.com/$GITHUB_REPOSITORY/actions/workflows/release-build.yml)"
          } >> "$GITHUB_STEP_SUMMARY"
