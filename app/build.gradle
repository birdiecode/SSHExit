plugins {
    id 'com.android.application'
}

def releaseStoreFile = System.getenv("ANDROID_KEYSTORE_FILE")
def releaseStorePassword = System.getenv("ANDROID_KEYSTORE_PASSWORD")
def releaseKeyAlias = System.getenv("ANDROID_KEY_ALIAS")
def releaseKeyPassword = System.getenv("ANDROID_KEY_PASSWORD")
def releaseSigningConfigured = [
        releaseStoreFile,
        releaseStorePassword,
        releaseKeyAlias,
        releaseKeyPassword
].every { value -> value != null && !value.trim().isEmpty() }

def debugCommitHash = System.getenv("GITHUB_SHA")
if (debugCommitHash == null || debugCommitHash.trim().isEmpty()) {
    try {
        def process = ["git", "rev-parse", "--short=7", "HEAD"].execute(null, rootProject.projectDir)
        process.waitFor()
        if (process.exitValue() == 0) {
            debugCommitHash = process.in.text.trim()
        }
    } catch (Exception ignored) {
        // Builds from source archives may not have Git metadata.
    }
}
if (debugCommitHash == null || debugCommitHash.trim().isEmpty()) {
    debugCommitHash = "unknown"
}
debugCommitHash = debugCommitHash.take(7)

android {
    namespace 'ru.birdiecode.ssh2socks4android'
    compileSdk 36

    defaultConfig {
        applicationId 'ru.birdiecode.ssh2socks4android'
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName '1.0.0'
    }

    signingConfigs {
        if (releaseSigningConfigured) {
            release {
                storeFile rootProject.file(releaseStoreFile)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }

    buildTypes {
        debug {
            versionNameSuffix "-debug-${debugCommitHash}"

            // Trusted CI builds can sign debug APKs with the same key as releases.
            // Without signing secrets (for example, pull request builds), Android uses
            // its standard debug key.
            if (releaseSigningConfigured) {
                signingConfig signingConfigs.release
            }
        }
        release {
            if (releaseSigningConfigured) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'com.github.mwiede:jsch:2.28.8'
    implementation 'com.google.android.material:material:1.13.0'
}
