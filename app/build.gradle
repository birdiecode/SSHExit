plugins {
    id 'com.android.application'
}

android {
    namespace 'ru.birdiecode.ssh2socks4android'
    compileSdk 36

    defaultConfig {
        applicationId 'ru.birdiecode.ssh2socks4android'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'com.github.mwiede:jsch:2.28.8'
}
